apiVersion: management.cattle.io/v3
kind: NodeDriver
metadata:
  name: cloudblast
  annotations:
    publicCredentialFields: baseUrl,insecure
    privateCredentialFields: token
    nodedriver.cattle.io/file-to-field-aliases: "userData:userData"
spec:
  active: true
  addCloudCredential: true
  builtin: false
  checksum: ""
  description: ""
  displayName: CloudBlast
  externalId: ""
  uiUrl: ""
  url: https://github.com/gorizond/docker-machine-driver-cloudblast/releases/download/v0.1.0/docker-machine-driver-cloudblast_v0.1.0_linux_amd64.tar.gz
  whitelistDomains:
    - console.cloudblast.io
